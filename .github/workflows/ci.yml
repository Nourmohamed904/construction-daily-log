name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: construction_log
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Set up database tables
        working-directory: backend
        env:
          PGPASSWORD: postgres123
        run: psql -h localhost -U postgres -d construction_log -f setup.sql

      - name: Run tests
        working-directory: backend
        env:
          PORT: 5000
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: construction_log
          JWT_SECRET: mysecretkey123
        run: npm test